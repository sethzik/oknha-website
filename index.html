<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Chúc Mừng Ngày Nhà Giáo Việt Nam 20/11 🌸</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 50% 120%, rgba(255, 170, 190, 0.55), transparent 60%),
                linear-gradient(180deg, #25103f 0%, #4a2270 28%, #9b3f86 58%, #e0728f 82%, #ffb3a7 100%);
            background-attachment: fixed;
            background-color: #4a2270;
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
            color: #fff;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== HIỆU ỨNG PHÁO HOA ===== */
        .firework {
            position: fixed;
            width: 6px; height: 6px;
            border-radius: 50%;
            animation: fireworkBurst 1.5s ease-out forwards;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes fireworkBurst {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* ===== PARTICLES / SAO LẤNG ===== */
        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 3px; height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* ===== NỘI DUNG CHÍNH ===== */
        .main-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .banner {
            animation: fadeInDown 1.5s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .date-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24, #f0932b);
            padding: 12px 40px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(255, 107, 107, 0.4);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(255, 107, 107, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 12px 48px rgba(255, 107, 107, 0.6); }
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            background: linear-gradient(90deg, #f7d794, #f8c291, #e77f67, #f7d794);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite, fadeInDown 2s ease-out;
            text-shadow: none;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .teacher-name {
            font-family: 'Dancing Script', cursive;
            font-size: 2.6rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 24px rgba(255, 183, 201, 0.9), 0 2px 6px rgba(0,0,0,0.25);
            margin-bottom: 12px;
            animation: fadeInDown 2.2s ease-out;
        }

        .subtitle {
            font-size: 1.6rem;
            color: #dfe6e9;
            font-weight: 300;
            margin-bottom: 40px;
            animation: fadeInDown 2.5s ease-out;
            font-style: italic;
        }

        /* ===== CARD TRI ÂN ===== */
        .card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: rgba(60, 10, 50, 0.35);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px 25px;
            width: 280px;
            transition: all 0.4s ease;
            animation: fadeInUp 1s ease-out;
            animation-fill-mode: backwards;
        }

        .card:nth-child(1) { animation-delay: 0.3s; }
        .card:nth-child(2) { animation-delay: 0.6s; }
        .card:nth-child(3)
